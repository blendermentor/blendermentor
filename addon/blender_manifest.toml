# BlenderMentor — Extension Manifest for Blender 4.2+

schema_version = "1.0.0"
id = "blendermentor"
version = "0.5.0"
name = "BlenderMentor"
tagline = "AI-powered teaching assistant that guides you through Blender step-by-step"
maintainer = "BlenderMentor Contributors"
type = "add-on"

tags = [
    "3D View",
    "Education",
    "Interface",
    "Workflow",
]

license = [
    "SPDX:GPL-3.0-or-later",
]

copyright = [
    "2024-2026 BlenderMentor Contributors",
]

website = "https://www.blendermentor.org"

# Modern extensions require 4.2.0 or higher
blender_version_min = "4.2.0"

# Declaring required system permissions as per Blender guidelines
[permissions]
network = "Required to connect to AI provider APIs (Gemini, Claude, DeepSeek, Ollama) and fetch Blender documentation"

